<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clamp fit explorer</title><style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}.explorer{max-width:950px;margin:auto;padding:24px}header small{color:var(--text-dim);font:11px ui-monospace,monospace;letter-spacing:1.4px;text-transform:uppercase}h1{font-size:clamp(23px,4vw,32px);font-weight:600;letter-spacing:-1px;margin:8px 0 6px}header p{font-size:13px;color:var(--text-dim);margin:0 0 24px}.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(220px,1fr);gap:24px}.drawing{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}svg{width:100%;height:auto;display:block}svg text{font-family:ui-monospace,monospace;fill:var(--text-dim);font-size:12px}.controls label{display:block;font-size:13px;margin:0 0 20px}.controls label span{display:flex;justify-content:space-between;gap:10px}.controls output{font:13px ui-monospace,monospace;color:var(--text)}input{width:100%;margin:12px 0 0;accent-color:var(--primary-q);height:22px}.readout{border-top:1px solid var(--line);padding-top:16px;margin-top:4px}.readout small{color:var(--text-dim);font-size:11px}.readout strong{display:block;font-size:23px;font-weight:500;margin:5px 0}.readout p{font-size:12px;color:var(--text-dim);margin:0}.negative{color:var(--amber-text,var(--amber))}.positive{color:var(--primary-q)}footer{margin-top:18px;color:var(--text-dim);font-size:11px}@media(max-width:620px){.layout{grid-template-columns:1fr;gap:20px}.explorer{padding:18px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.controls label{margin-bottom:15px}.readout{grid-column:1/-1}}
</style></head><body><main class="explorer"><header><small>Inline visual · interactive geometry</small><h1>Clamp fit explorer</h1><p>Move the sliders. The side view and clearances update together.</p></header><div class="layout"><div class="drawing"><svg viewBox="0 0 440 360" aria-label="Side view of a desk and monitor clamp"><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="var(--line)" stroke-width="1"/></pattern></defs><path d="M48 64H296V102H48Z" id="desk" fill="url(#hatch)" stroke="var(--text-dim)" stroke-width="1.5"/><path d="M270 34H330V184H270" id="clamp" fill="none" stroke="var(--primary-q)" stroke-width="9" stroke-linejoin="round"/><path id="screw" d="M296 184V111" stroke="var(--text)" stroke-width="4"/><rect id="pad" x="280" y="105" width="32" height="8" rx="3" fill="var(--text)"/><path d="M294 34V0" stroke="var(--text-dim)" stroke-width="5"/><text x="54" y="51">DESKTOP</text><text x="341" y="85">CLAMP</text><path id="measure" d="M32 64V102M26 64H38M26 102H38" fill="none" stroke="var(--text-dim)"/><text id="desk-label" x="48" y="126">25 mm</text><path id="space" d="M248 102V216" stroke="var(--amber)" stroke-dasharray="4 4"/><path id="obstruction" d="M180 224H314" stroke="var(--text-dim)" stroke-dasharray="4 5"/><text x="54" y="337">UNDER-DESK OBSTRUCTION</text><text id="space-label" x="140" y="172">60 mm clear</text></svg></div><div class="controls"><label><span>Desk thickness <output id="thickness-value">25 mm</output></span><input id="thickness" aria-label="Desk thickness" type="range" min="10" max="80" value="25"></label><label><span>Clamp opening <output id="opening-value">60 mm</output></span><input id="opening" aria-label="Clamp opening" type="range" min="20" max="100" value="60"></label><label><span>Space below desk <output id="clearance-value">60 mm</output></span><input id="clearance" aria-label="Space below desk" type="range" min="10" max="100" value="60"></label><label><span>Clamp depth below <output id="depth-value">40 mm</output></span><input id="depth" aria-label="Clamp depth below" type="range" min="10" max="90" value="40"></label><div class="readout" aria-live="polite"><small>GEOMETRIC CLEARANCE</small><strong id="result">35 mm opening spare</strong><p id="second">20 mm underneath spare</p></div></div></div><footer>Example dimensions. Replace them with your own measurements.</footer></main><script>
const ids=['thickness','opening','clearance','depth'];const get=id=>document.getElementById(id);function update(){const [t,o,c,d]=ids.map(id=>Number(get(id).value));for(const id of ids)get(id+'-value').textContent=get(id).value+' mm';const bottom=64+t*1.15,obstruction=bottom+c*1.15,clampBottom=bottom+d*1.15;get('desk').setAttribute('d',`M48 64H296V${bottom}H48Z`);get('clamp').setAttribute('d',`M270 34H330V${clampBottom}H270`);get('screw').setAttribute('d',`M296 ${clampBottom}V${bottom+9}`);get('pad').setAttribute('y',bottom+3);get('measure').setAttribute('d',`M32 64V${bottom}M26 64H38M26 ${bottom}H38`);get('desk-label').textContent=t+' mm';get('desk-label').setAttribute('y',bottom+25);get('space').setAttribute('d',`M248 ${bottom}V${obstruction}`);get('obstruction').setAttribute('d',`M180 ${obstruction}H314`);get('space-label').textContent=c+' mm clear';get('space-label').setAttribute('y',bottom+c*.6);const gap=o-t,below=c-d;get('result').textContent=Math.abs(gap)+' mm '+(gap>=0?'opening spare':'beyond opening');get('result').className=gap>=0?'positive':'negative';get('second').textContent=Math.abs(below)+' mm '+(below>=0?'underneath spare':'underneath overlap');get('second').className=below>=0?'':'negative'}ids.forEach(id=>get(id).addEventListener('input',update));update();
</script></body></html>
