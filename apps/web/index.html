<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#14161b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The one display face, fetched before the first paint that uses it. -->
    <link rel="preload" href="/fonts/archivo-semiexpanded-600.woff2" as="font" type="font/woff2" crossorigin />
    <!-- iOS ignores SVG icons entirely; without a PNG apple-touch-icon it
         screenshots the page and uses that on the home screen. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png?v=5" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
    <link rel="mask-icon" href="/icon.svg?v=5" color="#c9ccd9" />
    <meta name="apple-mobile-web-app-title" content="helm" />
    <title>helm</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
