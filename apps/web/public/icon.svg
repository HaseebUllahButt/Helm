<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <!-- a ship's wheel - the helm itself. One silver gradient runs across the
       whole wheel so it lights as a single object; the handles are turned
       spindles, the hub carries the app's indigo. favicon.svg is the same
       wheel drawn bolder for 16-32px, where these grooves turn to mush. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c25"/>
      <stop offset="1" stop-color="#0a0a0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d7aff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#6d7aff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="-190" x2="0" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f5fa"/>
      <stop offset=".5" stop-color="#c9ccd9"/>
      <stop offset="1" stop-color="#8d92a5"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="-15" x2="0" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9aa4ff"/>
      <stop offset="1" stop-color="#5563ee"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <!-- one handle, pointing along +x: neck, bead, neck, knob -->
    <g id="handle">
      <path d="M106 -11H124C131 -11 133 -16 141 -16S151 -10 157 -10V10C151 10 149 16 141 16S131 11 124 11H106Z"/>
      <circle cx="170" r="19"/>
    </g>
    <rect id="spoke" x="-100" y="-9.5" width="200" height="19" rx="9.5"/>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="1" y="1" width="510" height="510" rx="115" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <g transform="translate(256 256) scale(1.1)">
    <circle r="230" fill="url(#glow)"/>
    <g filter="url(#lift)">
      <g fill="url(#metal)">
        <use xlink:href="#handle"/>
        <use xlink:href="#handle" transform="rotate(60)"/>
        <use xlink:href="#handle" transform="rotate(120)"/>
        <use xlink:href="#handle" transform="rotate(180)"/>
        <use xlink:href="#handle" transform="rotate(240)"/>
        <use xlink:href="#handle" transform="rotate(300)"/>
        <use xlink:href="#spoke"/>
        <use xlink:href="#spoke" transform="rotate(60)"/>
        <use xlink:href="#spoke" transform="rotate(120)"/>
      </g>
      <circle r="100" fill="none" stroke="url(#metal)" stroke-width="32"/>
      <circle r="100" fill="none" stroke="#07070a" stroke-opacity=".45" stroke-width="2.5"/>
      <circle r="46" fill="url(#metal)"/>
      <circle r="33" fill="none" stroke="#07070a" stroke-opacity=".3" stroke-width="2.5"/>
      <circle r="15" fill="url(#gem)"/>
    </g>
  </g>
</svg>
