<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- helm's mark: an open ship's wheel in one white on a black tile. The rim
       is six-sided with a corner on each spoke, the handles end flat, and the
       hub is a ring, so the wheel has air between every part.
       favicon.svg is the same wheel drawn heavier for 16-32px. -->
  <rect width="512" height="512" rx="72" fill="#000"/>
  <g transform="translate(256 256)" fill="#f4f4f2"><polygon points="-15.0,-112 15.0,-112 11.0,-204 -11.0,-204" transform="rotate(0)"/><polygon points="-15.0,-112 15.0,-112 11.0,-204 -11.0,-204" transform="rotate(60)"/><polygon points="-15.0,-112 15.0,-112 11.0,-204 -11.0,-204" transform="rotate(120)"/><polygon points="-15.0,-112 15.0,-112 11.0,-204 -11.0,-204" transform="rotate(180)"/><polygon points="-15.0,-112 15.0,-112 11.0,-204 -11.0,-204" transform="rotate(240)"/><polygon points="-15.0,-112 15.0,-112 11.0,-204 -11.0,-204" transform="rotate(300)"/><rect x="-8.0" y="-116" width="16" height="232" transform="rotate(0)"/><rect x="-8.0" y="-116" width="16" height="232" transform="rotate(60)"/><rect x="-8.0" y="-116" width="16" height="232" transform="rotate(120)"/><polygon points="0.00,-116.00 100.46,-58.00 100.46,58.00 0.00,116.00 -100.46,58.00 -100.46,-58.00" fill="none" stroke="#f4f4f2" stroke-width="24" stroke-linejoin="miter"/><polygon points="0.00,-34.00 29.44,-17.00 29.44,17.00 0.00,34.00 -29.44,17.00 -29.44,-17.00" fill="#000" stroke="#f4f4f2" stroke-width="16" stroke-linejoin="miter"/></g>
</svg>
