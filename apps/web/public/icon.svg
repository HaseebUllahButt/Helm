<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="116" fill="#131317"/>
  <rect x="1" y="1" width="510" height="510" rx="115" fill="none" stroke="#ffffff" stroke-opacity=".07"/>
  <!-- a ship's wheel - the helm itself. knob-ended handles so it reads
       as a wheel and not a gear; the hub gets an axle hole. -->
  <g transform="translate(256 256) scale(1.14)">
    <g stroke="#c2c6d4" fill="none" stroke-linecap="round">
      <circle r="104" stroke-width="31"/>
      <g stroke-width="20">
        <path d="M-104 0H104"/>
        <path d="M-104 0H104" transform="rotate(60)"/>
        <path d="M-104 0H104" transform="rotate(120)"/>
      </g>
      <g stroke-width="22">
        <path d="M112 0H150"/>
        <path d="M112 0H150" transform="rotate(60)"/>
        <path d="M112 0H150" transform="rotate(120)"/>
        <path d="M112 0H150" transform="rotate(180)"/>
        <path d="M112 0H150" transform="rotate(240)"/>
        <path d="M112 0H150" transform="rotate(300)"/>
      </g>
    </g>
    <g fill="#c2c6d4">
      <circle cx="166" r="16"/>
      <circle cx="166" r="16" transform="rotate(60)"/>
      <circle cx="166" r="16" transform="rotate(120)"/>
      <circle cx="166" r="16" transform="rotate(180)"/>
      <circle cx="166" r="16" transform="rotate(240)"/>
      <circle cx="166" r="16" transform="rotate(300)"/>
    </g>
    <circle r="42" fill="#c2c6d4"/>
    <circle r="11" fill="#131317"/>
  </g>
</svg>
