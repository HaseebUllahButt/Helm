<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- icon.svg for a browser tab and the sidebar: heavier rim, spokes and
       handles, a plain hub and no shading, so the wheel and its indigo king
       spoke still read at 16px. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22262e"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <g transform="translate(256 256) rotate(-12)" fill="#e8eaef">
    <g transform="rotate(60)"><rect x="-21" y="-196" width="42" height="90" rx="21"/></g>
    <g transform="rotate(120)"><rect x="-21" y="-196" width="42" height="90" rx="21"/></g>
    <g transform="rotate(180)"><rect x="-21" y="-196" width="42" height="90" rx="21"/></g>
    <g transform="rotate(240)"><rect x="-21" y="-196" width="42" height="90" rx="21"/></g>
    <g transform="rotate(300)"><rect x="-21" y="-196" width="42" height="90" rx="21"/></g>
    <rect x="-13" y="-96" width="26" height="192"/>
    <rect x="-13" y="-96" width="26" height="192" transform="rotate(60)"/>
    <rect x="-13" y="-96" width="26" height="192" transform="rotate(120)"/>
    <circle r="96" fill="none" stroke="#e8eaef" stroke-width="42"/>
    <circle r="40"/>
    <rect x="-21" y="-196" width="42" height="90" rx="21" fill="#8590ff"/>
  </g>
</svg>
