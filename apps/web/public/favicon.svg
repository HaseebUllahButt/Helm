<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- icon.svg for a browser tab and the sidebar: the same six-sided rim and
       flat-ended handles, drawn heavier, with a plain hub and no inner
       spokes, so the wheel still reads at 16-22px. Same soft light from
       the right as icon.svg. -->
  <defs>
    <radialGradient id="light" cx="540" cy="200" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="460" y1="0" x2="60" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.22"/>
    </linearGradient>
    <g id="wheel" transform="translate(256 256)" fill="#f4f4f2"><polygon points="-24.0,-104 24.0,-104 20.0,-206 -20.0,-206" transform="rotate(0)"/><polygon points="-24.0,-104 24.0,-104 20.0,-206 -20.0,-206" transform="rotate(60)"/><polygon points="-24.0,-104 24.0,-104 20.0,-206 -20.0,-206" transform="rotate(120)"/><polygon points="-24.0,-104 24.0,-104 20.0,-206 -20.0,-206" transform="rotate(180)"/><polygon points="-24.0,-104 24.0,-104 20.0,-206 -20.0,-206" transform="rotate(240)"/><polygon points="-24.0,-104 24.0,-104 20.0,-206 -20.0,-206" transform="rotate(300)"/><polygon points="0.00,-112.00 96.99,-56.00 96.99,56.00 0.00,112.00 -96.99,56.00 -96.99,-56.00" fill="none" stroke="#f4f4f2" stroke-width="40" stroke-linejoin="miter"/><circle r="46"/></g>
    <mask id="wheelMask"><use href="#wheel"/></mask>
  </defs>
  <rect width="512" height="512" rx="72" fill="#000"/>
  <rect width="512" height="512" rx="72" fill="url(#light)"/>
  <use href="#wheel"/>
  <rect width="512" height="512" fill="url(#fade)" mask="url(#wheelMask)"/>
</svg>
